<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Vivere Kaffettino</title>
		<link href="./css/output.css" rel="stylesheet">
	</head>
	<body class="h-full text-2xl text-white flex w-full justify-center text-center">
		<form method="post" action="/submitConfigs" class="group flex flex-col justify-center text-center items-center gap-10 w-2/3 lg:w-1/3 2xl:w-1/5 h-full">

			<h1 class="text-white font-bold w-full text-3xl sm:text-4xl md:text-5xl xl:text-6xl"> VIVERE KAFFETTINO </h1>

			<input required type="text" name="wifiSSID" id="wifiSSID" placeholder="Insert wifi SSID" value="%WIFI_SSID%" class="bg-white text-black px-5 py-2 rounded-2xl w-full">

			<div class="flex justify-center w-full">
				<label for="isEAP" class="mr-5 select-none w-full"> EAP </label>
				<input type="checkbox" name="isEAP" id="isEAP" value="true" class="w-full" %ISEAP% onchange="toggleEAPSection()">
			</div>
			
			<!-- Section of EAP configs  -->
			<div id="inputsIsEAP" class="flex flex-col justify-center h-fit gap-10 w-full">				
				<input required type="text" name="eapUsername" id="eapUsername" placeholder="Insert EAP username" class="bg-white text-black px-5 py-2 rounded-2xl w-full">
				<input required type="text" name="eapPassword" id="eapPassword" placeholder="Insert EAP password" class="bg-white text-black px-5 py-2 rounded-2xl w-full">				
			</div>

			<!-- Section of non EAP WiFi configs  -->
			<div id="inputsIsNotEAP" class="flex w-full">
				<input required type="text" name="wifiPassword" id="wifiPassword" placeholder="Insert wifi password" class="bg-white text-black px-5 py-2 rounded-2xl w-full">				
			</div>

			<input type="submit" value="Confirm" class="bg-white hover:bg-gray-400 active:bg-gray-500 text-black px-10 py-5 rounded-2xl w-full transition-all duration-200">
		</form>

	<script src="./js/main.js">
	</script> 

	</body>
</html>
