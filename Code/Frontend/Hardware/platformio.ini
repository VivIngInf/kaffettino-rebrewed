; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
	esp32async/AsyncTCP@^3.4.9				; Lib to start TCP connections (for the webserver)
	esp32async/ESPAsyncWebServer@^3.9.1		; Lib to host a webserver using the ESP32
	vshymanskyy/Preferences@^2.2.2			; Lib to store data in the flash memory
build_flags = 
	-D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000	; DO NOT CHANGE, ideal value from library creator
	-D CONFIG_ASYNC_TCP_PRIORITY=10			; DO NOT CHANGE, ideal value from library creator
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64		; DO NOT CHANGE, ideal value from library creator
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1		; DO NOT CHANGE, ideal value from library creator
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096		; DO NOT CHANGE, ideal value from library creator
extra_scripts = pre:upload-spiffs.py		; Script to upload static resoruces for the fallback website
